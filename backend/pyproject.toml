[project]
name = "spherex-change-lens"
version = "0.1.0"
description = "Draft Python contracts and data services for SPHEREx Change Lens"
requires-python = ">=3.10,<3.11"
dependencies = [
    "astropy==6.1.7",
    "fastapi==0.162.5",
    "pydantic==2.14.3",
    "requests==2.34.2",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = ["live: opt-in test that accesses the IRSA archive over the network"]
